  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="style.css">

  <!--Calendar item-->

</head>

<body>
  <header>
    <h1>Nkashama96</h1>
    <p>Just a Developer</p>
  </header>

  <nav>
    <ul>
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#portfolio">Portfolio</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <main>

    <!-- ABOUT -->
    <section id="about">
      <img id="profile-photo" src="img/profile.png" alt="Profile">
      <div class="about-content">
        <h2>About Me 👋</h2>
        <p id="about-text">Loading...</p>
      </div>
    </section>

    <hr>

    <!-- SKILLS -->
    <section id="skills">
      <h2>My Skills 🛠️</h2>
      <ul id="skills-list"></ul>
      <iframe src="https://tryhackme.com/api/v2/badges/public-profile?userPublicId=7041840" style="width: 100%; border: none; overflow-x: hidden;"scrolling="no"></iframe>
    </section>

    <hr>

    <!-- PORTFOLIO -->
    <section id="portfolio">
      <h2>Portfolio 🚀</h2>
      <div id="portfolio-grid" class="portfolio-grid"></div>
      <hr>
      <h3>API 🔥</h3>
      <!--<label for="datepicker">Select date:</label>
      <input type="text" id="datepicker">
      <p>Here is one of my repo. Calculate Weeks: <span id="week-api">Loading...</span></p>-->
    </section>

    <hr>

    <!-- TIMELINE -->
    <section id="timeline">
      <h2>📍 Timeline 🚩</h2>
      <iframe src='https://cdn.knightlab.com/libs/timeline3/latest/embed/index.html?source=v2%3A2PACX-1vTK3t09NVR14XRlaxRInW2p128ukTjN4sJc7Zj2dv-Xr_0wZQ9pdjKfvVif3KLtCkCjTV4Es1xg4VpP&font=Default&lang=en&initial_zoom=2&width=100%25&height=650' width='100%' height='650' webkitallowfullscreen mozallowfullscreen allowfullscreen frameborder='0'></iframe>
    </section>

    <hr>

    <!-- CONTACT -->
    <section id="contact">
      <h2>Contact Me ✉️</h2>

      <div class="contact-icons">
        <a class="email" href="mailto:e.tneice@gmail.com" aria-label="Email">
          <i class="fa-solid fa-envelope"></i>
        </a>

        <a class="github" href="https://github.com/nkashama96"
           target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>

        <a class="linkedin" href="https://th.linkedin.com/in/tanasupe"
           target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin"></i>
        </a>
      </div>
    </section>

  </main>

  <footer>

    <p>&copy; 2025 - <script>document.write(new Date().getFullYear());</script> By Nkashama96</p>
  </footer>

  <!-- Load Data -->
  <script src="js/data.js"></script>

  <script>
    fetch('about.txt')
      .then(res => res.text())
      .then(text => document.getElementById('about-text').innerText = text);

    const skillsList = document.getElementById("skills-list");
    skills.forEach(skill => {
      const li = document.createElement("li");
      li.textContent = skill;
      skillsList.appendChild(li);
    });

    const portfolioGrid = document.getElementById("portfolio-grid");
    projects.forEach(p => {
      const item = document.createElement("div");
      item.className = "portfolio-item";

      // Check if links exist, otherwise return empty string
      const viewLink = p.link ? `<a href="${p.link}" target="_blank">View</a>` : '';
      const githubLink = p.github ? `<a href="${p.github}" target="_blank">GitHub</a>` : '';
      const separator = (p.link && p.github) ? ' | ' : '';
      
      item.innerHTML = `
        <img src="${p.image}" alt="${p.title}">
        <div class="portfolio-item-info">
          <h3>${p.title}</h3>
          <p>${p.description}</p>
          ${viewLink}${separator}${githubLink}
        </div>
      `;
      portfolioGrid.appendChild(item);
    });

    // 1. Store your Render API URL in a variable
    async function updateWeekDisplay() {
    const displayElement = document.getElementById('week-api');
    try {
      // Replace with your actual deployed API URL
      const response = await fetch('https://week-api.onrender.com');
      const data = await response.text();
      displayElement.innerText = data;
    } catch (err) {
      displayElement.innerText = "Error loading data";
      console.error(err);
    }
  }
  updateWeekDisplay();
  </script>

</body>
</html>
